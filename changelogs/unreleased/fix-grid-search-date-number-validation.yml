---
title: Fix grid column search incorrectly matching date and number values
type: fix
description: |
  Grid column search for date and number fields matched values
  incorrectly in both directions:

  - Typing a single-digit month or day (e.g. `6/2026` for June 2026)
    produced no results, since dayjs requires exactly two digits for
    `MM`/`DD` format tokens, unlike moment.js which accepted a single
    digit.
  - Typing an unparseable or out-of-range value (e.g. a typo, a long
    digit string like `4239374231`, or digits followed by stray text)
    was silently accepted and sent to the search query as a bogus
    value (`Invalid Date`, `0`, a truncated year, or a rolled-over
    date) instead of being rejected.

  Single-digit month/day input is now accepted, while unparseable or
  out-of-range values are dropped from the search instead of being
  sent, and the offending input is highlighted with an error message
  until it is corrected or cleared.
